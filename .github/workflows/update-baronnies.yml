name: Agenda Drôme - mode test noindex

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mode-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Agenda gele - ne pas chercher de nouveaux evenements
        run: echo "Mode test actif - agenda.json actuel conserve, aucune collecte lancee."

      - name: Regenerer les fiches depuis agenda.json existant
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          MAX_EVENT_AI_CALLS: "100"
        run: python generate_event_pages.py

      - name: Passer tout le site en noindex
        run: python set_noindex.py

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add _event_seo_cache.json
          git add evenements
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mode test noindex - agenda gele"
          git push
