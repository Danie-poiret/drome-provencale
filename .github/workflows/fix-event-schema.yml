name: Completer organizer Schema.org

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-event-schema.yml"

permissions:
  contents: write

jobs:
  fix-organizer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Ajouter propose par a organizer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("generate_event_pages.py")
          text = path.read_text(encoding="utf-8")
          old = '''    patterns = (\n        r"(?i:\\borganis(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n        r"(?i:\\borganisateur(?:rice)?\\s*[:\\-]\\s*)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n    )'''
          new = '''    patterns = (\n        r"(?i:\\borganis(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n        r"(?i:\\bpropos(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n        r"(?i:\\borganisateur(?:rice)?\\s*[:\\-]\\s*)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n    )'''
          if old not in text:
              raise SystemExit("Bloc schema_organizer introuvable")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile generate_event_pages.py

      - name: Regenerer les fiches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          MAX_EVENT_AI_CALLS: "50"
        run: python generate_event_pages.py

      - name: Ajouter habillage DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_event_pages.py _event_seo_cache.json evenements sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Completer organizer Schema.org"
          git push
