name: Ameliorer Schema.org Event

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-event-schema.yml"

permissions:
  contents: write

jobs:
  fix-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Ajouter organizer performer et offers
        run: |
          echo '' | base64 -d > /tmp/fix_schema.py
          python /tmp/fix_schema.py

      - name: Verifier la syntaxe Python
        run: python -m py_compile extract_datatourisme_drome.py generate_event_pages.py

      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extract_datatourisme_drome.py generate_event_pages.py
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Ameliorer les donnees structurees Event"
          git push
