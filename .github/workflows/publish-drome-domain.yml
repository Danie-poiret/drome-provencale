name: Publier drome.vivreanyons.fr

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Passer le site sur le sous-domaine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://danie-poiret.github.io/drome-provencale/"
          new = "https://drome.vivreanyons.fr/"

          pages = [Path("index.html"), *Path("evenements").rglob("*.html")]
          for path in pages:
              text = path.read_text(encoding="utf-8")
              text = text.replace(old, new)
              text = text.replace("noindex,follow", "index,follow")
              path.write_text(text, encoding="utf-8")

          for filename in ("sitemap.xml", "robots.txt", "generate_event_pages.py"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8").replace(old, new)
              path.write_text(text, encoding="utf-8")

          workflow_changes = {
              Path(".github/workflows/datatourisme-drome.yml"): (
                  "name: DATAtourisme Drôme - 100 événements",
                  None,
              ),
              Path(".github/workflows/update-baronnies.yml"): (
                  "name: DATAtourisme Drôme - test sans OpenAI",
                  ("Test DATAtourisme - toute la Drome en noindex",
                   "Test DATAtourisme - toute la Drome"),
              ),
          }
          noindex_step = (
              "      - name: Passer tout le site en noindex\n"
              "        run: python set_noindex.py\n\n"
          )
          for path, (new_name, commit_change) in workflow_changes.items():
              text = path.read_text(encoding="utf-8")
              first_line, rest = text.split("\n", 1)
              text = new_name + "\n" + rest
              text = text.replace(noindex_step, "")
              if commit_change:
                  text = text.replace(*commit_change)
              path.write_text(text, encoding="utf-8")

          Path("CNAME").write_text("drome.vivreanyons.fr\n", encoding="utf-8")
          Path("set_noindex.py").unlink(missing_ok=True)
          Path(".github/workflows/publish-drome-domain.yml").unlink(missing_ok=True)
          PY

      - name: Vérifier les changements
        shell: bash
        run: |
          if grep -R "noindex" --include="*.html" index.html evenements; then
            echo "Erreur : noindex est encore présent"
            exit 1
          fi
          if grep -R "https://danie-poiret.github.io/drome-provencale/" --exclude-dir=".git" .; then
            echo "Erreur : l'ancien domaine est encore présent"
            exit 1
          fi
          test "$(cat CNAME)" = "drome.vivreanyons.fr"

      - name: Publier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier la Drôme sur drome.vivreanyons.fr"
          git push
