name: Appliquer titles SEO et Le savais-tu

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-unique-seo-titles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Generer les fiches
        env:
          MAX_EVENT_AI_CALLS: "0"
        run: python generate_event_pages.py

      - name: Appliquer les faits thematiques sans API
        env:
          MAX_SAVIEZVOUS_API_CALLS: "0"
        run: python fix_saviezvous.py

      - name: Ajouter attribution DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Verifier les titles et les faits uniques
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          expected = len(json.loads(Path("agenda.json").read_text(encoding="utf-8"))["events"])
          titles = []
          facts = []
          for path in Path("evenements").glob("*/index.html"):
              text = path.read_text(encoding="utf-8")
              match = re.search(r"<title>(.*?)</title>", text, re.S)
              if not match:
                  raise SystemExit(f"title manquant: {path}")
              titles.append(html.unescape(match.group(1)).strip().casefold())

              section = re.search(
                  r'<section class="section anecdote"><h2>💡 Le savais-tu \?</h2>'
                  r'<p>(.*?)</p>(.*?)</section>',
                  text,
                  re.S,
              )
              if not section:
                  raise SystemExit(f"Le savais-tu thématique manquant: {path}")
              if "href=" in section.group(0):
                  raise SystemExit(f"Lien interdit dans Le savais-tu: {path}")
              fact = html.unescape(re.sub(r"<[^>]+>", "", section.group(1))).strip().casefold()
              facts.append(fact)

          if len(titles) != expected or len(titles) != len(set(titles)):
              raise SystemExit(
                  f"titles invalides: {len(titles)} fiches, "
                  f"{len(set(titles))} uniques"
              )
          if len(facts) != expected or len(facts) != len(set(facts)):
              raise SystemExit(
                  f"faits invalides: {len(facts)} fiches, "
                  f"{len(set(facts))} uniques"
              )
          print(f"{expected} fiches, {expected} titles uniques")
          print(f"{expected} fiches, {expected} Le savais-tu thématiques uniques, sans lien")
          PY

      - name: Enregistrer les fiches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_event_pages.py fix_saviezvous.py saviezvous_drome.json _saviezvous_cache.json evenements
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Appliquer les Le savais-tu thématiques"
          git push
