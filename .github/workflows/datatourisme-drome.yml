name: DATAtourisme Drôme - 150 événements

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  datatourisme-drome:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Recuperer tous les evenements DATAtourisme de la Drome
        env:
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
          DATATOURISME_EVENT_LIMIT: "150"
        run: python extract_datatourisme_drome.py

      - name: Verifier le nombre de nouvelles redactions payantes
        env:
          MAX_EVENT_AI_CALLS: "60"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from generate_event_pages import clean, event_hash

          events = json.loads(Path("agenda.json").read_text(encoding="utf-8"))["events"]
          cache = json.loads(Path("_event_seo_cache.json").read_text(encoding="utf-8"))
          missing = []
          for event in events:
              entry = cache.get(clean(event.get("url")))
              if not isinstance(entry, dict) or entry.get("hash") != event_hash(event):
                  missing.append(event)

          maximum = int(os.environ["MAX_EVENT_AI_CALLS"])
          print(f"Rédactions payantes prévues : {len(missing)} (plafond : {maximum})")
          if len(missing) > maximum:
              raise SystemExit("Arrêt avant appel OpenAI : plafond de coût dépassé")
          PY

      - name: Generer 150 fiches uniques comme agenda.vivreanyons.fr
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          MAX_EVENT_AI_CALLS: "60"
          MAX_SAVIEZVOUS_API_CALLS: "8"
          SAVIEZVOUS_BATCH_SIZE: "25"
          FAIL_ON_EVENT_FALLBACKS: "1"
        run: python generate_event_pages.py

      - name: Ajouter habillage et attribution DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Verifier les 150 fiches avant publication
        env:
          EXPECTED_EVENT_COUNT: "150"
        run: python validate_event_site.py

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agenda.json
          git add _event_seo_cache.json
          git add _saviezvous_cache.json
          git add index.html
          git add evenements
          git add sitemap.xml
          git add robots.txt
          git add validate_event_site.py

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Ajouter 50 nouvelles fiches autour de Nyons"
          git push
