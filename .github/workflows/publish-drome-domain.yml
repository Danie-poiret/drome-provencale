name: Publier drome.vivreanyons.fr

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Passer le site sur le sous-domaine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "https://danie-poiret.github.io/drome-provencale/"
          new = "https://drome.vivreanyons.fr/"

          pages = [Path("index.html"), *Path("evenements").rglob("*.html")]
          for path in pages:
              original = path.read_text(encoding="utf-8")
              updated = original.replace(old, new)
              updated = updated.replace("noindex,follow", "index,follow")
              if updated != original:
                  path.write_text(updated, encoding="utf-8")

          for filename in ("sitemap.xml", "robots.txt", "generate_event_pages.py"):
              path = Path(filename)
              original = path.read_text(encoding="utf-8")
              updated = original.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")

          Path("CNAME").write_text("drome.vivreanyons.fr\n", encoding="utf-8")
          Path("set_noindex.py").unlink(missing_ok=True)
          PY

      - name: Vérifier les changements
        shell: bash
        run: |
          if grep -R "noindex" --include="*.html" index.html evenements; then
            echo "Erreur : noindex est encore présent"
            exit 1
          fi
          if grep -R "https://danie-poiret.github.io/drome-provencale/" --exclude-dir=".git" --exclude="publish-drome-domain.yml" .; then
            echo "Erreur : l'ancien domaine est encore présent"
            exit 1
          fi
          test "$(cat CNAME)" = "drome.vivreanyons.fr"

      - name: Publier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publier la Drôme sur drome.vivreanyons.fr"
          git push
