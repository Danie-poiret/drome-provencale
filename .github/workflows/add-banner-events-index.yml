name: Embellir la page événements

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-banner-events-index.yml"

permissions:
  contents: write

jobs:
  beautify-index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier le script
        run: python -m py_compile beautify_events_index.py

      - name: Embellir uniquement l'index
        run: python beautify_events_index.py

      - name: Enregistrer la nouvelle page d'accueil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_event_pages.py evenements/index.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Embellir la page d'accueil des événements"
          git push
