name: Appliquer Schema.org Event

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-event-schema.yml"

permissions:
  contents: write

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Finaliser le JSON-LD Event
        run: |
          echo '' | base64 -d > /tmp/final_schema.py
          python /tmp/final_schema.py
          python -m py_compile extract_datatourisme_drome.py generate_event_pages.py

      - name: Recuperer les evenements DATAtourisme
        env:
          DATATOURISME_API_KEY: ${{ secrets.DATATOURISME_API_KEY }}
          DATATOURISME_EVENT_LIMIT: "100"
        run: python extract_datatourisme_drome.py

      - name: Regenerer les fiches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          MAX_EVENT_AI_CALLS: "50"
        run: python generate_event_pages.py

      - name: Ajouter habillage DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extract_datatourisme_drome.py generate_event_pages.py agenda.json _event_seo_cache.json index.html evenements sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Corriger performer offers organizer Schema.org"
          git push
