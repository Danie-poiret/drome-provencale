name: Mise a jour agenda Baronnies V1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-baronnies:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Extraire agenda Baronnies hors Nyons
        run: python extract_baronnies.py

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agenda.json
          git add _detail_cache.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise a jour agenda Baronnies V1"
          git push
