name: Corriger noms performer Schema.org

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-event-schema.yml"

permissions:
  contents: write

jobs:
  fix-performer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Corriger extraction des noms
        run: |
          echo '' | base64 -d > /tmp/fix_performer.py
          python /tmp/fix_performer.py
          python -m py_compile generate_event_pages.py

      - name: Regenerer les fiches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          MAX_EVENT_AI_CALLS: "50"
        run: python generate_event_pages.py

      - name: Ajouter habillage DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_event_pages.py _event_seo_cache.json evenements sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Corriger les noms performer Schema.org"
          git push
