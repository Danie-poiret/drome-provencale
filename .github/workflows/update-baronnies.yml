name: Mise a jour agenda Baronnies - moteur Nyons

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: write

jobs:
  extract-baronnies:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Extraire agenda hors Nyons
        run: python extract_baronnies_v10.py

      - name: Generer les 100 fiches evenements
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
          MAX_EVENT_AI_CALLS: "100"
        run: python generate_event_pages.py

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agenda.json
          git add _detail_cache_v9.json
          git add _event_seo_cache.json
          git add evenements
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise a jour agenda et fiches SEO"
          git push
