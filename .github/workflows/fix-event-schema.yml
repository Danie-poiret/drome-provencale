name: Nettoyer Schema.org Event

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-event-schema.yml"

permissions:
  contents: write

jobs:
  clean-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Nettoyer organizer et performer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("generate_event_pages.py")
          text = path.read_text(encoding="utf-8")

          old_org = '''    patterns = (\n        r"(?i:\\borganis(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n        r"(?i:\\bpropos(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n        r"(?i:\\borganisateur(?:rice)?\\s*[:\\-]\\s*)([A-ZÀ-ÖØ-Þ][^.;]{2,80})",\n    )\n    for pattern in patterns:\n        match = re.search(pattern, text)\n        if match:\n            return _cut_clean_text(match.group(1), 80).strip(" .,:;-")\n    return ""'''
          new_org = '''    patterns = (\n        r"(?i:\\borganis(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^,.;]{2,80})",\n        r"(?i:\\bpropos(?:é|ée) par\\s+(?:la\\s+|le\\s+|les\\s+|l['’]\\s*)?)([A-ZÀ-ÖØ-Þ][^,.;]{2,80})",\n        r"(?i:\\borganisateur(?:rice)?\\s*[:\\-]\\s*)([A-ZÀ-ÖØ-Þ][^,.;]{2,80})",\n    )\n    for pattern in patterns:\n        match = re.search(pattern, text)\n        if match:\n            value = _cut_clean_text(match.group(1), 80).strip(" .,:;-")\n            value = re.split(r"(?i)\\s+(?:et|avec)\\s+(?:le|la|les|l['’])?\\s*soutien\\b", value, maxsplit=1)[0]\n            return value.strip(" .,:;-")\n    return ""'''
          if old_org not in text:
              raise SystemExit("Bloc organizer introuvable")
          text = text.replace(old_org, new_org, 1)

          old_perf = '''    patterns = (\n        rf"(?i:\\b(?:avec|par|anim(?:é|ée) par|interpr(?:été|étée) par)\\s+){name}",\n        rf"(?i:\\b(?:concert|récital|spectacle|exposition|conférence))(?:\\s+[a-zà-ÿœ'’\\-]+){{0,3}}\\s+(?i:de|par)\\s+{name}",\n    )'''
          new_perf = '''    patterns = (\n        rf"(?i:\\b(?:avec|anim(?:é|ée) par|interpr(?:été|étée) par)\\s+){name}",\n        rf"(?:^|[.!?]\\s+)(?i:par)\\s+{name}",\n        rf"(?i:\\b(?:concert|récital|spectacle|exposition|conférence))(?:\\s+[a-zà-ÿœ'’\\-]+){{0,3}}\\s+(?i:de|par)\\s+{name}",\n    )'''
          if old_perf not in text:
              raise SystemExit("Bloc performer introuvable")
          text = text.replace(old_perf, new_perf, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile generate_event_pages.py

      - name: Regenerer les fiches
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: "gpt-5.6-terra"
          MAX_EVENT_AI_CALLS: "50"
        run: python generate_event_pages.py

      - name: Ajouter habillage DATAtourisme
        run: python prepare_datatourisme_test.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generate_event_pages.py _event_seo_cache.json evenements sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Nettoyer organizer et performer Schema.org"
          git push
