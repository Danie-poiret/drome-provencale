name: Mise a jour agenda Baronnies V4

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: write

jobs:
  extract-baronnies:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Installer Chromium
        run: python -m playwright install --with-deps chromium

      - name: Extraire le PDF officiel Baronnies hors Nyons
        run: python extract_baronnies_v4.py

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agenda.json

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise a jour agenda Baronnies V4"
          git push
